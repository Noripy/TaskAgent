name: CI

# ローカルと同じ Docker イメージの中で検証する（「自分の PC では通る」を無くす）。
# 中身は pnpm verify = lint → check:docs → typecheck → unit → workers → build → バンドルサイズ。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (dev イメージ内)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # レイヤキャッシュを GitHub Actions に置く。依存が変わらなければ deps 層は再利用される
      - name: Build image (target=ci)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          tags: taskagent-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: pnpm verify
        run: docker run --rm taskagent-ci:${{ github.sha }} pnpm verify
