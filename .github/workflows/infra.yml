name: Infra (Terraform)

# PR では fmt / validate / plan。Secrets 未登録（初期セットアップ前・fork からの PR）でも
# validate までは必ず走らせ、provider のスキーマ誤りを早期に検知する。
# apply は手動実行（workflow_dispatch + apply=true）に限定し、誤適用を防ぐ。
# 必要な Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: "true にすると apply する"
        required: true
        default: "false"

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - run: terraform fmt -check -recursive

      # Secrets が揃っているかで、backend 付き init（plan 可能）か backend なし init（validate のみ）かを切り替える
      - name: Detect credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$TF_VAR_cloudflare_account_id" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare / R2 の Secrets が未登録のため validate のみ実行します（docs/ops/cloudflare-setup.md の手順 1・2・7）"
          fi

      - name: Init (validate only, no backend)
        if: steps.creds.outputs.available == 'false'
        run: terraform init -backend=false

      - name: Init (state on R2)
        if: steps.creds.outputs.available == 'true'
        run: |
          terraform init \
            -backend-config="bucket=taskagent-tfstate" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="endpoints={s3=\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"

      - run: terraform validate

      - name: Plan
        if: steps.creds.outputs.available == 'true'
        run: terraform plan -no-color -out=tfplan

      - name: Apply (manual only)
        if: steps.creds.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        run: terraform apply -no-color tfplan
